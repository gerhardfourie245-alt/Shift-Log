<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift & Fuel Log (GBT 10)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #b0b0b0;
            --accent-color: #ffb74d;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --entry-bg: #2a2a2a;
            --border-highlight: #ffb74d;
            --btn-text: #121212;
            --success-color: #81c784;
            --warning-color: #ff8a65;
        }

        body.sunlight-mode {
            --bg-color: #ffffff;
            --card-bg: #f5f5f5;
            --text-color: #000000;
            --subtext-color: #222222;
            --accent-color: #d84315;
            --input-bg: #ffffff;
            --input-border: #000000;
            --entry-bg: #e0e0e0;
            --border-highlight: #d84315;
            --btn-text: #ffffff;
            --success-color: #1b5e20;
            --warning-color: #b71c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2 {
            color: var(--accent-color);
            margin: 0;
            font-size: 22px;
        }

        h3 {
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .theme-toggle-btn {
            background: var(--accent-color);
            color: var(--btn-text);
            border: 2px solid #000;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--input-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--subtext-color);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
        }

        button.action-btn {
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 16px;
        }

        button.action-btn:active {
            opacity: 0.8;
        }

        .log-entry {
            background: var(--entry-bg);
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            border-left: 6px solid var(--border-highlight);
            color: var(--text-color);
        }

        .metric-highlight {
            font-weight: bold;
            font-size: 15px;
            display: block;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header-row">
        <h2>Shift & Fuel Log</h2>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Sunlight Mode</button>
    </div>
    
    <div class="card">
        <h3>Vehicle Details</h3>
        <label>Registration Number</label>
        <input type="text" id="regNumber" value="CEM 1705">
        
        <label>Fleet Number</label>
        <input type="text" id="fleetNumber" value="GBT 10">

        <label>Driver Name</label>
        <input type="text" id="driverName" value="Gerhard">
    </div>

    <div class="card">
        <h3>Current Readings</h3>
        <label>Odometer (km)</label>
        <input type="number" id="odometer" placeholder="e.g. 145200">

        <label>Engine Hours</label>
        <input type="number" step="0.1" id="engineHours" placeholder="e.g. 1250.5">

        <label>Crane Hours</label>
        <input type="number" step="0.1" id="craneHours" placeholder="e.g. 120.0">

        <label>Liters Filled</label>
        <input type="number" step="0.1" id="litersFilled" placeholder="e.g. 250">

        <label>Pump Rand Value (Total cost)</label>
        <input type="number" step="0.01" id="pumpValue" placeholder="e.g. 5750.00">

        <button class="action-btn" onclick="saveFillUp()">Save Fill-Up & Calculate</button>
    </div>

    <div class="card">
        <h3>Recent History & Performance</h3>
        <div id="historyList">No logs saved yet.</div>
    </div>

<script>
    let logs = JSON.parse(localStorage.getItem('gbt10_logs') || '[]');

    function initTheme() {
        const savedTheme = localStorage.getItem('gbt10_theme');
        if (savedTheme === 'sunlight') {
            document.body.classList.add('sunlight-mode');
            document.getElementById('themeBtn').innerText = '🌙 Night Mode';
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('sunlight-mode');
        const isSunlight = document.body.classList.contains('sunlight-mode');
        localStorage.setItem('gbt10_theme', isSunlight ? 'sunlight' : 'night');
        document.getElementById('themeBtn').innerText = isSunlight ? '🌙 Night Mode' : '☀️ Sunlight Mode';
    }

    function renderHistory() {
        const listDiv = document.getElementById('historyList');
        if (logs.length === 0) {
            listDiv.innerHTML = "No logs saved yet.";
            return;
        }

        let html = '';
        for (let i = logs.length - 1; i >= 0; i--) {
            let curr = logs[i];
            html += `<div class="log-entry">
                <strong>Odo:</strong> ${curr.odometer} km | <strong>Liters:</strong> ${curr.liters} L<br>
                <strong>Engine Hrs:</strong> ${curr.engineHours} | <strong>Crane Hrs:</strong> ${curr.craneHours}<br>`;
            
            if (i > 0) {
                let prev = logs[i - 1];
                let dist = curr.odometer - prev.odometer;
                let kmPerLtr = (dist / curr.liters).toFixed(2);
                let costPerKm = curr.pumpValue && dist > 0 ? (curr.pumpValue / dist).toFixed(2) : 'N/A';
                
                html += `<span class="metric-highlight" style="color: var(--success-color);">
                    Distance: ${dist} km | KM/L: ${kmPerLtr} | Cost/KM: R${costPerKm}
                </span>`;
            } else {
                html += `<span class="metric-highlight" style="color: var(--warning-color);">
                    Baseline entry recorded (Waiting for 2nd fill-up)
                </span>`;
            }
            html += `</div>`;
        }
        listDiv.innerHTML = html;
    }

    function saveFillUp() {
        let odometer = parseFloat(document.getElementById('odometer').value);
        let engineHours = parseFloat(document.getElementById('engineHours').value);
        let craneHours = parseFloat(document.getElementById('craneHours').value);
        let liters = parseFloat(document.getElementById('litersFilled').value);
        let pumpValue = parseFloat(document.getElementById('pumpValue').value);

        if (isNaN(odometer) || isNaN(liters)) {
            alert("Please fill in at least the Odometer and Liters filled!");
            return;
        }

        let entry = {
            date: new Date().toLocaleDateString(),
            odometer: odometer,
            engineHours: isNaN(engineHours) ? 0 : engineHours,
            craneHours: isNaN(craneHours) ? 0 : craneHours,
            liters: liters,
            pumpValue: isNaN(pumpValue) ? 0 : pumpValue
        };

        logs.push(entry);
        localStorage.setItem('gbt10_logs', JSON.stringify(logs));

        document.getElementById('odometer').value = '';
        document.getElementById('engineHours').value = '';
        document.getElementById('craneHours').value = '';
        document.getElementById('litersFilled').value = '';
        document.getElementById('pumpValue').value = '';

        renderHistory();
        alert("Fill-up saved successfully!");
    }

    initTheme();
    renderHistory();
</script>

</body>
</html>
