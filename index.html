<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift & Fuel Log (GBT 10)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #b0b0b0;
            --accent-color: #ffb74d;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --entry-bg: #2a2a2a;
            --border-highlight: #ffb74d;
            --btn-text: #121212;
            --success-color: #81c784;
            --warning-color: #ff8a65;
        }
        body.sunlight-mode {
            --bg-color: #ffffff;
            --card-bg: #f5f5f5;
            --text-color: #000000;
            --subtext-color: #222222;
            --accent-color: #d84315;
            --input-bg: #ffffff;
            --input-border: #000000;
            --entry-bg: #e0e0e0;
            --border-highlight: #d84315;
            --btn-text: #ffffff;
            --success-color: #1b5e20;
            --warning-color: #b71c1c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { color: var(--accent-color); margin: 0; font-size: 22px; }
        h3 { color: var(--accent-color); margin-top: 0; margin-bottom: 8px; }
        .theme-toggle-btn {
            background: var(--accent-color); color: var(--btn-text);
            border: 2px solid #000; padding: 8px 12px; font-weight: bold;
            font-size: 14px; border-radius: 6px; cursor: pointer; width: auto; margin: 0;
        }
        .card {
            background: var(--card-bg); padding: 16px; border-radius: 8px;
            margin-bottom: 16px; border: 1px solid var(--input-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        label { display: block; margin-top: 10px; font-size: 14px; font-weight: bold; color: var(--subtext-color); }
        input {
            width: 100%; padding: 12px; margin-top: 4px;
            background: var(--input-bg); border: 2px solid var(--input-border);
            color: var(--text-color); border-radius: 6px; font-size: 18px;
            font-weight: bold; box-sizing: border-box;
        }
        button.action-btn {
            background: var(--accent-color); color: var(--btn-text); border: none;
            padding: 16px; width: 100%; font-size: 18px; font-weight: bold;
            border-radius: 6px; cursor: pointer; margin-top: 16px;
        }
        button.action-btn:active { opacity: 0.8; }
        button.small-btn {
            background: transparent; color: var(--text-color);
            border: 2px solid var(--input-border); padding: 8px 12px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-right: 8px;
        }
        .error-msg { color: var(--warning-color); font-weight: bold; margin-top: 10px; min-height: 1em; }
        .info-msg { color: var(--success-color); font-weight: bold; margin-top: 10px; }
        .log-entry {
            background: var(--entry-bg); padding: 12px; border-radius: 6px; margin-top: 10px;
            font-size: 14px; border-left: 6px solid var(--border-highlight); color: var(--text-color);
        }
        .metric-highlight { font-weight: bold; font-size: 15px; display: block; margin-top: 6px; }
        .since { color: var(--subtext-color); font-size: 13px; display: block; margin-top: 4px; }
        .entry-actions { margin-top: 10px; }
        .hist-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .toggle-row { display: flex; gap: 8px; margin-top: 8px; }
        .tog { flex: 1; padding: 14px 6px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
               background: var(--input-bg); color: var(--text-color); border: 2px solid var(--input-border); }
        .tog.on { background: var(--accent-color); color: var(--btn-text); border-color: var(--accent-color); }
        .now { font-weight: bold; color: var(--success-color); margin-bottom: 6px; }
        .mix { color: var(--subtext-color); font-size: 13px; display: block; margin-top: 4px; }
        .est-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--input-border); }
        .est-row:first-of-type { border-top: 0; }
        .note { color: var(--subtext-color); font-size: 13px; margin-top: 8px; }
        .qrow { display: flex; gap: 6px; margin-top: 6px; }
        .qgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
        .qgrid button { padding: 12px 0; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer;
                        background: var(--input-bg); color: var(--text-color); border: 2px solid var(--input-border); }
        .qlabel { font-size: 13px; color: var(--subtext-color); margin-top: 8px; }
        .qrow button { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
                       background: var(--input-bg); color: var(--text-color); border: 2px solid var(--input-border); }
        details summary { cursor: pointer; font-weight: bold; color: var(--subtext-color); margin-top: 12px; }
    </style>
</head>
<body>

    <div class="header-row">
        <h2>Shift & Fuel Log</h2>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Sunlight Mode</button>
    </div>

    <div class="card">
        <h3>Vehicle Details</h3>
        <label>Registration Number</label>
        <input type="text" id="regNumber" value="CEM 1705" oninput="saveVehicle()">

        <label>Fleet Number</label>
        <input type="text" id="fleetNumber" value="GBT 10" oninput="saveVehicle()">

        <label>Driver Name</label>
        <input type="text" id="driverName" value="Gerhard" oninput="saveVehicle()">

        <label>Truck capacity (pallets)</label>
        <input type="number" inputmode="numeric" id="capTruck" value="12" oninput="saveVehicle()">

        <label>Trailer capacity (pallets)</label>
        <input type="number" inputmode="numeric" id="capTrailer" value="12" oninput="saveVehicle()">
    </div>

    <div class="card">
        <h3>Load & Trailer</h3>
        <div class="now" id="nowStatus"></div>
        <div class="toggle-row">
            <button class="tog" id="tgSolo" onclick="setTrailer(false)">No trailer</button>
            <button class="tog" id="tgTrailer" onclick="setTrailer(true)">Trailer on</button>
        </div>

        <label>Pallets on truck</label>
        <input type="number" inputmode="numeric" id="truckP" value="0">
        <div class="qrow">
            <button onclick="setP('truckP',0)">Empty</button>
            <button onclick="setP('truckP','full')">Full</button>
        </div>
        <div class="qlabel">Offloaded: tap how many came off</div>
        <div class="qgrid" id="qgTruck"></div>

        <div id="trailerBlock">
            <label>Pallets on trailer</label>
            <input type="number" inputmode="numeric" id="trailerP" value="0">
            <div class="qrow">
                <button onclick="setP('trailerP',0)">Empty</button>
                <button onclick="setP('trailerP','full')">Full</button>
            </div>
            <div class="qlabel">Offloaded: tap how many came off</div>
            <div class="qgrid" id="qgTrailer"></div>
        </div>

        <label>Odometer now (km)</label>
        <input type="number" inputmode="decimal" step="any" id="evOdo" placeholder="e.g. 145230">

        <label>Invoice number (optional)</label>
        <input type="text" id="evInv" placeholder="e.g. 10452" maxlength="20">
        <div class="error-msg" id="evError" role="alert"></div>
        <button class="action-btn" style="margin-top:8px;" onclick="logStatus()">Log status change</button>
        <details>
            <summary>Status history</summary>
            <div id="evList"></div>
        </details>
    </div>

    <div class="card">
        <h3 id="formTitle">Current Readings</h3>
        <label>Date</label>
        <input type="date" id="entryDate">

        <label>Odometer (km)</label>
        <input type="number" inputmode="decimal" step="any" id="odometer" placeholder="e.g. 145200">

        <label>Engine Hours</label>
        <input type="number" inputmode="decimal" step="0.1" id="engineHours" placeholder="e.g. 1250.5">

        <label>Crane Hours</label>
        <input type="number" inputmode="decimal" step="0.1" id="craneHours" placeholder="e.g. 120.0">

        <label>Liters Filled (tank full to full)</label>
        <input type="number" inputmode="decimal" step="0.1" id="litersFilled" placeholder="e.g. 250">

        <label>Pump Rand Value (Total cost)</label>
        <input type="number" inputmode="decimal" step="0.01" id="pumpValue" placeholder="e.g. 5750.00">

        <div class="error-msg" id="errorMsg" role="alert"></div>
        <button class="action-btn" id="saveBtn" onclick="saveFillUp()">Save Fill-Up & Calculate</button>
        <button class="action-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none; background: transparent; color: var(--text-color); border: 2px solid var(--input-border);">Cancel edit</button>
    </div>

    <div class="card">
        <h3>Recent History & Performance</h3>
        <div id="totals"></div>
        <div id="estimates"></div>
        <div id="historyList">No logs saved yet.</div>
        <div class="entry-actions" style="margin-top:16px;">
            <button class="small-btn" onclick="copyCSV()">Copy as CSV</button>
        </div>
        <div class="info-msg" id="infoMsg"></div>
    </div>

<script>
    let logs = [];
    let events = [];
    let editIndex = null;
    let selTrailer = false;

    function caps() {
        const t = parseInt(document.getElementById('capTruck').value, 10);
        const r = parseInt(document.getElementById('capTrailer').value, 10);
        return { truck: t > 0 ? t : 12, trailer: r > 0 ? r : 12 };
    }
    function normEvent(e) {
        if (e.truckP === undefined) {
            const c = caps();
            e.truckP = e.loaded ? c.truck : 0;
            e.trailerP = e.trailer && e.loaded ? c.trailer : 0;
        }
        if (!e.trailer) e.trailerP = 0;
        return e;
    }
    function loadEvents() {
        try {
            const raw = localStorage.getItem('gbt10_status');
            events = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(events)) events = [];
        } catch (e) { events = []; }
        events = events.map(normEvent);
        events.sort((a, b) => a.odo - b.odo);
    }
    function persistEvents() {
        try { localStorage.setItem('gbt10_status', JSON.stringify(events)); }
        catch (e) { setInfo("Could not save on this device."); }
    }
    function statusText(s) {
        return s.trailer
            ? 'Trailer on · truck ' + s.truckP + ', trailer ' + s.trailerP + ' pallets'
            : 'No trailer · truck ' + s.truckP + ' pallets';
    }
    function setTrailer(v) {
        selTrailer = v;
        paintToggles();
    }
    function paintToggles() {
        document.getElementById('tgSolo').classList.toggle('on', !selTrailer);
        document.getElementById('tgTrailer').classList.toggle('on', selTrailer);
        document.getElementById('trailerBlock').style.display = selTrailer ? 'block' : 'none';
    }
    function setP(id, v) {
        const c = caps();
        const cap = id === 'truckP' ? c.truck : c.trailer;
        document.getElementById(id).value = v === 'full' ? cap : v;
    }
    function buildQuick() {
        const c = caps();
        [['qgTruck', 'truckP', c.truck], ['qgTrailer', 'trailerP', c.trailer]].forEach(q => {
            let h = '';
            for (let n = 1; n <= q[2]; n++) h += `<button onclick="adjP('${q[1]}',-${n})">−${n}</button>`;
            document.getElementById(q[0]).innerHTML = h;
        });
    }
    function adjP(id, d) {
        const c = caps();
        const cap = id === 'truckP' ? c.truck : c.trailer;
        let v = parseInt(document.getElementById(id).value, 10);
        if (isNaN(v)) v = 0;
        document.getElementById(id).value = Math.min(cap, Math.max(0, v + d));
    }
    function renderStatus() {
        const now = document.getElementById('nowStatus');
        if (events.length) {
            const c = events[events.length - 1];
            now.innerText = 'Now: ' + statusText(c) + ' (since ' + c.odo + ' km)';
        } else {
            now.innerText = 'No status logged yet. Set it below to start tracking.';
        }
        const list = document.getElementById('evList');
        if (!events.length) { list.innerHTML = '<div class="note">Nothing logged.</div>'; return; }
        let h = '';
        for (let i = events.length - 1; i >= 0; i--) {
            const e = events[i], nx = events[i + 1];
            const leg = nx ? f(nx.odo - e.odo, 0) + ' km at this load' : 'Current leg';
            h += `<div class="est-row"><span>${esc(e.odo)} km · ${statusText(e)}${e.inv ? ' · Inv ' + esc(e.inv) : ''}<span class="mix">${leg}</span></span><button class="small-btn" style="margin:0" onclick="deleteEvent(${i})">Delete</button></div>`;
        }
        list.innerHTML = h;
    }
    function logStatus() {
        const err = document.getElementById('evError');
        const odo = parseFloat(document.getElementById('evOdo').value);
        const c = caps();
        let tp = parseInt(document.getElementById('truckP').value, 10);
        let rp = parseInt(document.getElementById('trailerP').value, 10);
        if (isNaN(odo)) { err.innerText = "Enter the odometer reading."; return; }
        if (isNaN(tp)) tp = 0;
        if (isNaN(rp)) rp = 0;
        if (!selTrailer) rp = 0;
        if (tp < 0 || tp > c.truck) { err.innerText = "Truck pallets must be 0 to " + c.truck + "."; return; }
        if (rp < 0 || rp > c.trailer) { err.innerText = "Trailer pallets must be 0 to " + c.trailer + "."; return; }
        const last = events.length ? events[events.length - 1] : null;
        if (last && odo < last.odo) { err.innerText = "Odometer is lower than the last status change (" + last.odo + " km)."; return; }
        const inv = document.getElementById('evInv').value.trim();
        if (last && last.trailer === selTrailer && last.truckP === tp && last.trailerP === rp && !inv) { err.innerText = "That is already the current status."; return; }
        err.innerText = '';
        events.push({ odo: odo, trailer: selTrailer, truckP: tp, trailerP: rp, inv: inv, date: todayISO() });
        persistEvents();
        document.getElementById('evOdo').value = '';
        document.getElementById('evInv').value = '';
        renderStatus();
        renderHistory();
        setInfo("Status logged.");
    }
    function deleteEvent(i) {
        if (!confirm("Delete this status change?")) return;
        events.splice(i, 1);
        persistEvents();
        renderStatus();
        renderHistory();
    }

    // km between two odometer readings: with/without trailer, empty/loaded, pallet-km
    function kmBreakdown(P, X) {
        const out = { S: 0, T: 0, E: 0, L: 0, PK: 0, U: 0 };
        let cur = null, pos = P;
        events.forEach(e => { if (e.odo <= P) cur = e; });
        function add(st, k) {
            if (k <= 0) return;
            if (!st) { out.U += k; return; }
            const pal = st.truckP + (st.trailer ? st.trailerP : 0);
            if (st.trailer) out.T += k; else out.S += k;
            out.PK += k * pal;
            if (pal > 0) out.L += k; else out.E += k;
        }
        events.filter(e => e.odo > P && e.odo < X).forEach(e => { add(cur, e.odo - pos); pos = e.odo; cur = e; });
        add(cur, X - pos);
        return out;
    }

    // Least squares with no negative coefficients: liters = sum(rate * amount)
    function solve(A, b) {
        const n = b.length;
        for (let i = 0; i < n; i++) {
            let p = i;
            for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
            if (Math.abs(A[p][i]) < 1e-12) return null;
            [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
            for (let r = i + 1; r < n; r++) {
                const m = A[r][i] / A[i][i];
                for (let c = i; c < n; c++) A[r][c] -= m * A[i][c];
                b[r] -= m * b[i];
            }
        }
        const x = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) {
            let s = b[i];
            for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
            x[i] = s / A[i][i];
        }
        return x;
    }
    function fitRates(rows, cols) {
        const sc = {};
        cols.forEach(k => { sc[k] = Math.sqrt(rows.reduce((t, r) => t + r.x[k] * r.x[k], 0)) || 1; });
        let active = cols.slice();
        while (active.length) {
            const n = active.length;
            const A = Array.from({ length: n }, () => new Array(n).fill(0));
            const b = new Array(n).fill(0);
            rows.forEach(r => {
                active.forEach((ci, i) => {
                    b[i] += (r.x[ci] / sc[ci]) * r.y;
                    active.forEach((cj, j) => { A[i][j] += (r.x[ci] / sc[ci]) * (r.x[cj] / sc[cj]); });
                });
            });
            for (let i = 0; i < n; i++) A[i][i] += 1e-6;
            const sol = solve(A, b);
            if (!sol) return null;
            let worst = -1, wv = 0;
            sol.forEach((v, i) => { if (v < wv) { wv = v; worst = i; } });
            if (worst === -1) { const res = {}; active.forEach((ci, i) => res[ci] = sol[i] / sc[ci]); return res; }
            active.splice(worst, 1);
        }
        return null;
    }

    function loadLogs() {
        try {
            const raw = localStorage.getItem('gbt10_logs');
            logs = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(logs)) logs = [];
        } catch (e) { logs = []; }
    }

    function persist() {
        try { localStorage.setItem('gbt10_logs', JSON.stringify(logs)); }
        catch (e) { setInfo("Could not save on this device. Use Copy as CSV to keep your data."); }
    }

    function setInfo(t) { document.getElementById('infoMsg').innerText = t; }

    function todayISO() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function initTheme() {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('gbt10_theme'); } catch (e) {}
        if (savedTheme === 'sunlight') {
            document.body.classList.add('sunlight-mode');
            document.getElementById('themeBtn').innerText = '🌙 Night Mode';
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('sunlight-mode');
        const isSunlight = document.body.classList.contains('sunlight-mode');
        try { localStorage.setItem('gbt10_theme', isSunlight ? 'sunlight' : 'night'); } catch (e) {}
        document.getElementById('themeBtn').innerText = isSunlight ? '🌙 Night Mode' : '☀️ Sunlight Mode';
    }

    function saveVehicle() {
        buildQuick();
        try {
            localStorage.setItem('gbt10_vehicle', JSON.stringify({
                reg: document.getElementById('regNumber').value,
                fleet: document.getElementById('fleetNumber').value,
                driver: document.getElementById('driverName').value,
                capTruck: document.getElementById('capTruck').value,
                capTrailer: document.getElementById('capTrailer').value
            }));
        } catch (e) {}
    }

    function loadVehicle() {
        try {
            const v = JSON.parse(localStorage.getItem('gbt10_vehicle') || 'null');
            if (v) {
                document.getElementById('regNumber').value = v.reg;
                document.getElementById('fleetNumber').value = v.fleet;
                document.getElementById('driverName').value = v.driver;
                if (v.capTruck) document.getElementById('capTruck').value = v.capTruck;
                if (v.capTrailer) document.getElementById('capTrailer').value = v.capTrailer;
            }
        } catch (e) {}
    }

    function f(n, d) {
        if (n === null || n === undefined || !isFinite(n)) return '–';
        return Number(n).toFixed(d);
    }

    function esc(s) {
        return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    }

    function renderHistory() {
        const listDiv = document.getElementById('historyList');
        const totalsDiv = document.getElementById('totals');
        if (logs.length === 0) {
            listDiv.innerHTML = "No logs saved yet.";
            totalsDiv.innerHTML = "";
            document.getElementById('estimates').innerHTML = "";
            return;
        }

        let totL = 0, totKm = 0, totEh = 0, totCh = 0, totR = 0;
        let html = '';
        for (let i = logs.length - 1; i >= 0; i--) {
            const curr = logs[i];
            html += `<div class="log-entry">
                <div class="hist-top"><strong>${esc(curr.date || '')}</strong><span>${f(curr.liters,1)} L${curr.pumpValue ? ' · R' + f(curr.pumpValue,2) : ''}</span></div>
                <strong>Odo:</strong> ${curr.odometer} km<br>
                <strong>Engine Hrs:</strong> ${curr.engineHours} | <strong>Crane Hrs:</strong> ${curr.craneHours}<br>`;

            if (i > 0) {
                const prev = logs[i - 1];
                const dist = curr.odometer - prev.odometer;
                const dEng = curr.engineHours - prev.engineHours;
                const dCrane = curr.craneHours - prev.craneHours;
                const kmPerL = dist > 0 && curr.liters > 0 ? dist / curr.liters : null;
                const lPerEng = dEng > 0 ? curr.liters / dEng : null;
                const lPerCrane = dCrane > 0 ? curr.liters / dCrane : null;
                const costPerKm = curr.pumpValue && dist > 0 ? curr.pumpValue / dist : null;
                const perLitre = curr.pumpValue && curr.liters > 0 ? curr.pumpValue / curr.liters : null;
                const mix = kmBreakdown(prev.odometer, curr.odometer);
                const parts = [];
                if (mix.S > 0) parts.push('Solo ' + f(mix.S,0) + ' km');
                if (mix.T > 0) parts.push('With trailer ' + f(mix.T,0) + ' km');
                if (mix.E > 0) parts.push('Empty ' + f(mix.E,0) + ' km');
                if (mix.L > 0) parts.push('Loaded ' + f(mix.L,0) + ' km (avg ' + f(mix.PK / mix.L, 1) + ' pallets)');
                if (mix.U > 0 && parts.length) parts.push('Untracked ' + f(mix.U,0) + ' km');

                totL += curr.liters; totKm += Math.max(dist, 0);
                totEh += Math.max(dEng, 0); totCh += Math.max(dCrane, 0); totR += curr.pumpValue || 0;

                html += `<span class="metric-highlight" style="color: var(--success-color);">
                    KM/L: ${f(kmPerL,2)} | Cost/KM: ${costPerKm === null ? 'N/A' : 'R' + f(costPerKm,2)}
                </span>
                <span class="metric-highlight" style="color: var(--success-color);">
                    L/Engine h: ${f(lPerEng,1)} | L/Crane h: ${f(lPerCrane,1)}${perLitre === null ? '' : ' | R' + f(perLitre,2) + '/L'}
                </span>
                <span class="since">Since last fill: ${f(dist,0)} km, ${f(dEng,1)} engine h, ${f(dCrane,1)} crane h</span>
                ${parts.length ? '<span class="mix">' + parts.join(' · ') + '</span>' : ''}`;
            } else {
                html += `<span class="metric-highlight" style="color: var(--warning-color);">
                    Baseline entry (liters not counted, waiting for next fill-up)
                </span>`;
            }
            html += `<div class="entry-actions">
                <button class="small-btn" onclick="editEntry(${i})">Edit</button>
                <button class="small-btn" onclick="deleteEntry(${i})">Delete</button>
            </div></div>`;
        }
        listDiv.innerHTML = html;

        renderEstimates();
        if (logs.length > 1) {
            totalsDiv.innerHTML = `<div class="log-entry" style="border-left-color: var(--success-color);">
                <strong>Overall average (${logs.length - 1} fill-up${logs.length > 2 ? 's' : ''})</strong>
                <span class="metric-highlight" style="color: var(--success-color);">
                    KM/L: ${totL > 0 && totKm > 0 ? f(totKm / totL, 2) : '–'} | Cost/KM: ${totR > 0 && totKm > 0 ? 'R' + f(totR / totKm, 2) : 'N/A'}
                </span>
                <span class="metric-highlight" style="color: var(--success-color);">
                    L/Engine h: ${totEh > 0 ? f(totL / totEh, 1) : '–'} | L/Crane h: ${totCh > 0 ? f(totL / totCh, 1) : '–'}
                </span></div>`;
        } else {
            totalsDiv.innerHTML = "";
        }
    }

    function renderEstimates() {
        const box = document.getElementById('estimates');
        const rows = [];
        let totR = 0, totL = 0;
        for (let i = 1; i < logs.length; i++) {
            const c = logs[i], p = logs[i - 1];
            const dist = c.odometer - p.odometer;
            if (dist <= 0) continue;
            if (c.pumpValue > 0) { totR += c.pumpValue; totL += c.liters; }
            const m = kmBreakdown(p.odometer, c.odometer);
            if (m.U / dist > 0.1) continue;
            rows.push({ x: { S: m.S, T: m.T, PK: m.PK, CR: Math.max(c.craneHours - p.craneHours, 0) }, y: c.liters, dist: dist });
        }
        if (!events.length) { box.innerHTML = '<div class="note">Log your pallets and trailer status above to get a cost breakdown.</div>'; return; }
        const keys = ['S','T','PK','CR'];
        const cols = keys.filter(k => rows.some(r => r.x[k] > 0));
        const enough = {};
        keys.forEach(k => { enough[k] = rows.filter(r => r.x[k] > (k === 'S' || k === 'T' ? 0.05 * r.dist : 0)).length >= 2; });
        if (rows.length < cols.length + 1 || rows.length < 3) {
            box.innerHTML = `<div class="note">Cost breakdown needs about 4+ fill-ups with tracked status (have ${rows.length}). Keep logging.</div>`;
            return;
        }
        const rates = fitRates(rows, cols);
        if (!rates) { box.innerHTML = '<div class="note">Not enough variety yet to separate the conditions.</div>'; return; }
        const rl = totL > 0 ? totR / totL : null;
        const c = caps();
        const capS = c.truck, capT = c.truck + c.trailer;
        const aS = rates.S || 0, aT = rates.T || 0, p = rates.PK || 0;
        function line(label, a, n, ok) {
            let right = 'not enough data yet';
            const lpk = a + p * n;
            if (ok && lpk > 0) right = f(1 / lpk, 2) + ' km/L' + (rl ? ' · R' + f(lpk * rl, 2) + '/km' : '');
            return `<div class="est-row"><span>${label}</span><span>${right}</span></div>`;
        }
        let h = '<div class="log-entry" style="border-left-color: var(--success-color);"><strong>Estimated running cost</strong>';
        h += line('Truck empty', aS, 0, enough.S && aS > 0);
        h += line('Truck full (' + capS + ' pallets)', aS, capS, enough.S && aS > 0 && enough.PK && p > 0);
        h += line('Truck + trailer empty', aT, 0, enough.T && aT > 0);
        h += line('Truck + trailer full (' + capT + ')', aT, capT, enough.T && aT > 0 && enough.PK && p > 0);
        if (enough.PK && p > 0) {
            h += `<div class="est-row"><span>Cost per pallet-km</span><span>${rl ? 'R' + f(p * rl, 3) : f(p, 4) + ' L'}</span></div>`;
            if (enough.T && aT > 0) h += `<div class="est-row"><span>Full rig (${capT} pallets)</span><span>${f(capT / (aT + p * capT), 1)} pallet-km per L</span></div>`;
        }
        if (rates.CR !== undefined && enough.CR) {
            h += `<div class="est-row"><span>Crane working</span><span>${f(rates.CR,1)} L/h${rl ? ' · R' + f(rates.CR * rl, 0) + '/h' : ''}</span></div>`;
        }
        h += `<div class="note">Estimated from ${rows.length} fill-ups. Rough until you have 8–10 with different loads. Fuel only, excludes tyres, servicing, wages and licences.</div></div>`;
        box.innerHTML = h;
    }

    function clearForm() {
        ['odometer','engineHours','craneHours','litersFilled','pumpValue'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('entryDate').value = todayISO();
        document.getElementById('errorMsg').innerText = '';
        document.getElementById('formTitle').innerText = 'Current Readings';
        document.getElementById('saveBtn').innerText = 'Save Fill-Up & Calculate';
        document.getElementById('cancelBtn').style.display = 'none';
        editIndex = null;
    }

    function saveFillUp() {
        const err = document.getElementById('errorMsg');
        const odometer = parseFloat(document.getElementById('odometer').value);
        const engineHours = parseFloat(document.getElementById('engineHours').value);
        const craneHours = parseFloat(document.getElementById('craneHours').value);
        const liters = parseFloat(document.getElementById('litersFilled').value);
        const pumpValue = parseFloat(document.getElementById('pumpValue').value);
        const date = document.getElementById('entryDate').value || todayISO();

        if (isNaN(odometer) || isNaN(liters) || liters <= 0) {
            err.innerText = "Fill in at least the odometer and liters filled.";
            return;
        }

        const others = logs.filter((x, idx) => idx !== editIndex);
        const last = others.length ? others[others.length - 1] : null;
        if (last && odometer <= last.odometer) {
            err.innerText = "Odometer must be higher than the last fill-up (" + last.odometer + " km). Check the number.";
            return;
        }
        if (last && ((!isNaN(engineHours) && engineHours < last.engineHours) || (!isNaN(craneHours) && craneHours < last.craneHours))) {
            err.innerText = "Engine or crane hours are lower than the last fill-up. Check the numbers.";
            return;
        }

        const entry = {
            date: date,
            odometer: odometer,
            engineHours: isNaN(engineHours) ? 0 : engineHours,
            craneHours: isNaN(craneHours) ? 0 : craneHours,
            liters: liters,
            pumpValue: isNaN(pumpValue) ? 0 : pumpValue
        };

        if (editIndex !== null) logs[editIndex] = entry; else logs.push(entry);
        persist();
        clearForm();
        renderHistory();
        setInfo("Saved.");
    }

    function editEntry(i) {
        const e = logs[i];
        editIndex = i;
        document.getElementById('entryDate').value = /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : todayISO();
        document.getElementById('odometer').value = e.odometer;
        document.getElementById('engineHours').value = e.engineHours;
        document.getElementById('craneHours').value = e.craneHours;
        document.getElementById('litersFilled').value = e.liters;
        document.getElementById('pumpValue').value = e.pumpValue || '';
        document.getElementById('formTitle').innerText = 'Edit Fill-Up';
        document.getElementById('saveBtn').innerText = 'Update Fill-Up';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function cancelEdit() { clearForm(); }

    function deleteEntry(i) {
        if (!confirm("Delete this fill-up?")) return;
        logs.splice(i, 1);
        persist();
        if (editIndex !== null) clearForm();
        renderHistory();
    }

    function copyCSV() {
        let rows = ["date,odometer_km,engine_hours,crane_hours,liters,rand_total"]
            .concat(logs.map(e => [e.date, e.odometer, e.engineHours, e.craneHours, e.liters, e.pumpValue].join(",")))
            .join("\n");
        const evRows = events.length ? "\n\nodometer_km,trailer,truck_pallets,trailer_pallets,invoice\n" + events.map(e => [e.odo, e.trailer ? 'yes' : 'no', e.truckP, e.trailerP, '"' + String(e.inv || '').replace(/"/g, '') + '"'].join(",")).join("\n") : "";
        rows += evRows;
        try {
            navigator.clipboard.writeText(rows).then(
                () => setInfo("Copied. Paste into Notes or a spreadsheet."),
                () => setInfo(rows));
        } catch (e) { setInfo(rows); }
    }

    loadLogs();
    loadVehicle();
    loadEvents();
    if (events.length) {
        const c = events[events.length - 1];
        selTrailer = c.trailer;
        document.getElementById('truckP').value = c.truckP;
        document.getElementById('trailerP').value = c.trailerP;
    }
    buildQuick();
    paintToggles();
    renderStatus();
    initTheme();
    document.getElementById('entryDate').value = todayISO();
    renderHistory();
</script>

</body>
</html>
